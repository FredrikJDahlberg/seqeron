// seqeron — the cluster tier as its own repository: the sequencer, the replayer (both sides), the
// shared client classes, the tools, and the code generation for the schemas the cluster tier speaks.
// One project, no subprojects: the :cluster / :gateways split this tree was carved out of lived in
// the phixeron repo, and the product half of it went the other way.
//
// The project name is what the uber jar is named after, and every script resolves
// build/libs/seqeron-<version>-uber.jar by that name.
rootProject.name = 'seqeron'
