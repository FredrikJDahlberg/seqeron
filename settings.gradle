rootProject.name = 'seqeron'

// Aeron's shape: the client API is its own module, and the node depends on it. The direction is the
// compiler's to enforce now — a client class that reaches for Sequencer does not compile, where the
// single-source-set build caught it afterwards by scanning the constant pool (checkTierSeparation).
//   :client — what a process that only talks to a cluster needs: protocol, sequencer.client,
//             replayer.client, app, util, and the frame/replay codecs. The whole C++ half is here.
//   :node   — the sequencer, the Replayer's server side, the tools and the metrics exporter.
include 'seqeron-client', 'seqeron-service'

// seqeron-examples is deliberately not here: it is a separate build that resolves seqeron as a
// published artifact, which is what proves the artifact is consumable at all.
