// A consumer of seqeron, built outside its build: no source dependency, no subproject, just the
// published coordinate. That is the point — anything the artifact fails to expose fails here rather
// than passing on a source dependency.

plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    // ./gradlew publishToMavenLocal in the repo root puts seqeron here; Aeron and Agrona come from
    // Central, as the transitive dependencies its POM declares.
    mavenLocal()
    mavenCentral()
}

// One dependency, versioned by the BOM. seqeron declares Aeron and Agrona api, since they are in the
// signatures a consumer compiles against, so they arrive with it and are not redeclared here; the
// enforced platform holds them at seqeron's versions even if something else on the classpath asks for another.
// The version is read from the checkout this example ships in, so a bump does not break it. An outside
// consumer writes the number instead.
dependencies {
    implementation enforcedPlatform("org.limitless:seqeron-bom:${file('../../VERSION').text.trim()}")
    implementation 'org.limitless:seqeron'
}

application {
    mainClass = 'example.FollowStream'
    // Aeron's off-heap access, the same flags every script in the seqeron repo passes.
    applicationDefaultJvmArgs = ['--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                                 '--add-opens=java.base/java.lang=ALL-UNNAMED',
                                 '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                                 '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED']
}

tasks.named('run') {
    systemProperties System.getProperties().findAll { k, v -> k.toString().startsWith('follow.') }
}
