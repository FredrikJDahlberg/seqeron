name: release

# A v* tag publishes what that commit is: the Java artifacts on JitPack, the C# package on nuget.org, the
# node image on GHCR, and a GitHub Release carrying the operator distribution, the jars and the package. The
# Release is created last, so it exists only once everything it points at does.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # v0.2.0 was tagged on a commit whose VERSION still said 0.1.0.
      - name: Tag matches VERSION
        id: version
        run: |
          VERSION="$(cat VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}"
              exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seqeron-service" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: ./gradlew check operatorDistZip :seqeron-client:jar :seqeron-service:jar

      # Versioned from VERSION by Directory.Build.props, with its symbols beside it.
      - name: C# package
        run: |
          ./gradlew :seqeron-client:checkCSharpSbeCurrent
          dotnet test --project seqeron-client/src/test/csharp/Seqeron.Client.Tests.csproj
          dotnet pack -c Release -o build/nuget seqeron-client/src/main/csharp/Seqeron.Client.csproj

      # JitPack builds a tag on its first request and serves nothing until it has. Asking here means no
      # consumer waits on that build, and a tag JitPack cannot build fails the release.
      - name: JitPack build
        run: |
          POM="https://jitpack.io/com/github/${GITHUB_REPOSITORY}/seqeron-service/${GITHUB_REF_NAME}/seqeron-service-${GITHUB_REF_NAME}.pom"
          for _ in $(seq 1 40); do
              curl -sf -o /dev/null --max-time 60 "${POM}" && exit 0
              sleep 30
          done
          curl -s "https://jitpack.io/com/github/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/build.log" | tail -n 50
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}

      # Trusted publishing: nuget.org exchanges this job's OIDC token for a key that lasts an hour, so it is
      # requested here, after the JitPack wait, rather than up front.
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: frda

      # nuget.org takes a version once: a package pushed in error can be unlisted, never replaced. The push
      # carries the .snupkg beside the .nupkg to the symbol server.
      - name: Push C# package
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet nuget push "build/nuget/Org.Limitless.Seqeron.${VERSION}.nupkg" \
            --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The tag's notes, when it has some; --generate-notes appends the changelog link.
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          NOTES_ARGS=()
          [[ -f "${NOTES}" ]] && NOTES_ARGS=(--notes-file "${NOTES}")
          gh release create "${GITHUB_REF_NAME}" --generate-notes "${NOTES_ARGS[@]}" \
            "build/distributions/seqeron-${VERSION}.zip" \
            "build/libs/seqeron-${VERSION}-uber.jar" \
            "seqeron-client/build/libs/seqeron-${VERSION}.jar" \
            "seqeron-service/build/libs/seqeron-service-${VERSION}.jar" \
            "build/nuget/Org.Limitless.Seqeron.${VERSION}.nupkg"
