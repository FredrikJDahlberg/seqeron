name: chaos

# Randomized fault injection against a live three-node cluster (ChaosTest).
# Deliberately NOT containerized: every fault here is process-level — SIGTERM, SIGKILL, SIGSTOP,
# SIGUSR1, an in-process archive stall — and three containers on one runner share the same kernel and
# CPU pool as three processes do, so the container adds a failure domain the faults never cross.
# Containers only start earning their keep for the faults this catalogue does not have (partitions,
# netem), which need NET_ADMIN and a real bridge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: 'SEED to replay an exact fault sequence (blank = random)'
        required: false
      rounds:
        description: 'ROUNDS for the random leg'
        required: false
        default: '20'

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    name: chaos (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The catalogue, seeded at random so coverage broadens across runs rather than replaying one
          # sequence forever. The seed is printed in the log and re-runs the sequence exactly.
          - leg: random
            only_fault: ''
          # A fixed leg for the one fault a random draw can miss entirely: SEED=4242 over 20 rounds
          # drew pause/queue-stall/sigkill/queue-drop/kill-follower and ZERO kill-leader. Failover is the
          # fault least tolerable to leave to chance, so it gets a leg that always runs it.
          - leg: kill-leader
            only_fault: fault_kill_leader
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-java-${{ hashFiles('**/*.gradle', 'versions.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-java-

      # Deadlines doubled, not the fault timings: a shared 4-vCPU runner carries three members with
      # embedded drivers and archives, a gateway pair and three consumer replicas, and Aeron's
      # liveness timeouts measure wall clock. The mark-file settle and driver-loss grace are NOT
      # raised — they are Aeron's own 10s timeout, which a slow host does not lengthen.
      - name: Chaos run
        run: ./gradlew :seqeron-service:systemTest -Pchaos
        env:
          SEED: ${{ github.event.inputs.seed }}
          ROUNDS: ${{ github.event.inputs.rounds || '20' }}
          ONLY_FAULT: ${{ matrix.only_fault }}
          TIMEOUT_SCALE: '2'

      # The SEED is in here, and a failing chaos run is worthless without it.
      - name: Upload chaos logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-logs-${{ matrix.leg }}
          path: |
            seqeron-service/build/system-test/ChaosTest/
            seqeron-service/build/test-results/systemTest/

  # The C# client tier against a live cluster: ingress over UDP and IPC, confirmed ingress across a leader
  # kill, a cold start, and the C# examples, built from the packed package, through a gateway handover. On
  # Aeron.NET, which trails Aeron, so an Aeron upgrade's pull request is where this matters (spec V-1).
  csharp-client:
    name: C# client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-java-${{ hashFiles('**/*.gradle', 'versions.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-java-

      - name: Build uber jar
        run: ./gradlew uberJar

      - name: C# client run
        run: ./seqeron-service/src/test/scripts/csharp-client-test.sh

      - name: Upload C# client logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: csharp-client-logs
          path: logs/csharp-client/
