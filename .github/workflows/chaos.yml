name: chaos

# Randomized fault injection against a live three-node cluster (src/test/scripts/chaos-runner.sh).
# Deliberately NOT containerized: every fault here is process-level — SIGTERM, SIGKILL, SIGSTOP,
# SIGUSR1, an in-process archive stall — and three containers on one runner share the same kernel and
# CPU pool as three processes do, so the container adds a failure domain the faults never cross.
# Containers only start earning their keep for the faults this catalogue does not have (partitions,
# netem), which need NET_ADMIN and a real bridge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: 'SEED to replay an exact fault sequence (blank = random)'
        required: false
      rounds:
        description: 'ROUNDS for the random leg'
        required: false
        default: '20'

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    name: chaos (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The catalogue, seeded at random so coverage broadens across runs rather than replaying one
          # sequence forever. The seed is printed in the log and re-runs the sequence exactly.
          - leg: random
            only_fault: ''
          # A fixed leg for the one fault a random draw can miss entirely: SEED=4242 over 20 rounds
          # drew pause/tap-stall/sigkill/tap-drop/kill-follower and ZERO kill-leader. Failover is the
          # fault least tolerable to leave to chance, so it gets a leg that always runs it.
          - leg: kill-leader
            only_fault: fault_kill_leader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-java-${{ hashFiles('*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-java-

      # TestGateway — the gateway pair the faults run against — is test-source and in no jar, so the
      # test classes are a prerequisite beside the uber jar. chaos-runner.sh refuses to start without it.
      - name: Build uber jar and test classes
        run: ./gradlew uberJar compileTestJava

      # Deadlines doubled, not the fault timings: a shared 4-vCPU runner carries three members with
      # embedded drivers and archives, a gateway pair and three consumer replicas, and Aeron's
      # liveness timeouts measure wall clock. The mark-file settle and driver-loss grace are NOT
      # raised — they are Aeron's own 10s timeout, which a slow host does not lengthen.
      #
      # SESSION_TIMEOUT_MS is the one cluster-side timing raised here, and it is not a deadline the
      # harness measures: the gateway pair's keep-alives share a duty cycle with a blocking ingress
      # offer, so a kill-leader round that leaves ingress unconnected can starve them past the 1s
      # default. Both instances then fence on a healthy cluster and the round fails on a pair that is
      # gone. 5s covers the stall this runner produces; it does not paper over a real session loss,
      # which closes the session outright rather than letting it age out.
      - name: Chaos run
        run: ./src/test/scripts/chaos-runner.sh
        env:
          SEED: ${{ github.event.inputs.seed }}
          ROUNDS: ${{ github.event.inputs.rounds || '20' }}
          ONLY_FAULT: ${{ matrix.only_fault }}
          SESSION_TIMEOUT_MS: '5000'
          LEADER_TIMEOUT_SECS: '60'
          ELECTION_TIMEOUT_SECS: '30'
          NODE_START_TIMEOUT_SECS: '30'
          APP_CATCHUP_TIMEOUT_SECS: '60'

      # The SEED is in here, and a failing chaos run is worthless without it.
      - name: Upload chaos logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs-${{ matrix.leg }}
          path: logs/chaos/
