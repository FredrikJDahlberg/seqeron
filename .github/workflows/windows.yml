name: windows

# The C# client on Windows against members on Linux, on one runner (seqeron-service/src/test/scripts/
# csharp-windows-test.sh). The member runs in WSL1, which shares Windows' network stack, so Aeron's UDP meets on
# localhost both ways; WSL2 is a VM behind NAT, and a Windows runner runs no Linux containers. Windows runs the
# gateway host and the C# clients. What it tests is the client, not Aeron Cluster under WSL1.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csharp-windows:
    name: C# client on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks out CRLF by default, which bash then reads in the sourced scripts.
      - name: Check out with LF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Linux member's host (WSL1)
        uses: Vampire/setup-wsl@v7
        with:
          wsl-version: 1
          distribution: Ubuntu-24.04
          additional-packages: openjdk-21-jre-headless

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-windows-${{ hashFiles('**/*.gradle', 'versions.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-windows-

      - name: Build uber jar
        run: ./gradlew uberJar

      - name: C# client on Windows run
        run: ./seqeron-service/src/test/scripts/csharp-windows-test.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-windows-logs
          path: logs/csharp-windows/
