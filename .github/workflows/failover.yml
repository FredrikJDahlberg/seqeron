name: failover

# Containerized three-node failover test: docker/compose.yml runs one cluster member per container,
# so the harness loses a leader by killing its container rather than signalling a JVM that shares a
# host with its peers. The runner image already carries Docker and the Compose v2 plugin, and a
# GitHub runner is a VM rather than a container, so its daemon needs no privileged setup.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A failover run costs minutes; superseded PR pushes should not keep paying for them.
concurrency:
  group: failover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failover:
    name: docker failover
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-java-${{ hashFiles('*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-java-

      # docker/Dockerfile copies the jar rather than building it — a Gradle stage inside the image
      # would miss the runner cache restored above.
      - name: Build uber jar
        run: ./gradlew uberJar

      - uses: docker/setup-buildx-action@v3

      # Built here rather than by `compose up --build` so the layer cache persists between runs;
      # load: true puts the tag in the runner's daemon, where compose finds it.
      - name: Build node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: seqeron/node:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TIMEOUT_SCALE covers the CPU steal of a shared 4-vCPU runner: three members with embedded
      # media drivers plus their co-located replayers is an oversubscribed host, and Aeron's
      # liveness timeouts measure wall clock.
      - name: Failover soak
        run: ./src/test/scripts/docker-failover-test.sh
        env:
          COMPOSE_BUILD: '0'
          TIMEOUT_SCALE: '3'

      - name: Upload node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failover-logs
          path: logs/docker-failover/
