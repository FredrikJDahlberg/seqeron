name: failover

# Containerized three-node failover test: docker/compose.yml runs one cluster member per container,
# so the harness loses a leader by killing its container rather than signalling a JVM that shares a
# host with its peers. The runner image already carries Docker and the Compose v2 plugin, and a
# GitHub runner is a VM rather than a container, so its daemon needs no privileged setup.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A failover run costs minutes; superseded PR pushes should not keep paying for them.
concurrency:
  group: failover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failover:
    name: docker failover
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-java-${{ hashFiles('*.gradle', 'versions.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-java-

      # docker/Dockerfile copies the distribution rather than building it — a Gradle stage inside the
      # image would miss the runner cache restored above.
      - name: Build operator distribution
        run: ./gradlew operatorDist

      - uses: docker/setup-buildx-action@v4

      # Built here rather than by `compose up --build` so the layer cache persists between runs;
      # load: true puts the tag in the runner's daemon, where compose finds it.
      - name: Build node image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: seqeron/node:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TIMEOUT_SCALE covers the CPU steal of a shared 4-vCPU runner: three members with embedded
      # media drivers plus their co-located replayers is an oversubscribed host, and Aeron's
      # liveness timeouts measure wall clock.
      - name: Failover soak
        run: ./gradlew :seqeron-service:networkFaultTest --tests '*DockerFailoverSoakTest'
        env:
          COMPOSE_BUILD: '0'
          TIMEOUT_SCALE: '3'

      - name: Upload node logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failover-logs
          path: seqeron-service/build/system-test/

  # The faults no kill or pause produces, against the same docker/compose.yml cluster: a leader partitioned from its
  # peers while its clients stay connected, one link cut and no other, a follower whose loss repair is gone, a slow
  # and duplicating link, a member whose ballots are dropped, a leader starved of CPU, and a gateway host's relay
  # whose link to its member is unrepaired, jittery or slow to answer archive control. faulteron
  # (github.com/FredrikJDahlberg/faulteron) injects them with eBPF from privileged containers, which this VM's
  # daemon runs as it is. The tests are this repo's, in the systemTest source set; faulteron is the
  # tool they drive.
  network-faults:
    name: network faults (faulteron)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FAULTERON_DIR: ${{ github.workspace }}/faulteron
      TIMEOUT_SCALE: '3'
    steps:
      - uses: actions/checkout@v7

      # The tool, pinned, so a faulteron change reaches this workflow only when this line moves.
      - uses: actions/checkout@v7
        with:
          repository: FredrikJDahlberg/faulteron
          ref: 6a8f7d66fba963513e9a11da4e68df16e47d0939
          path: faulteron

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-java-${{ hashFiles('*.gradle', 'versions.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-java-

      # Each test brings the cluster up with `compose up --build`, as a local run does; the image copies this.
      - name: Build operator distribution
        run: ./gradlew operatorDist

      # No cluster: two throwaway containers and every kind of rule. A kernel that cannot load the program fails
      # here, once, rather than in every test below.
      - name: faulteron rules
        id: rules
        run: faulteron/test/faulteron-rules.sh

      # Each test below runs whatever the one before it did, so one run reports them all.
      - name: Leader partitioned from its peers
        if: ${{ !cancelled() && steps.rules.outcome == 'success' }}
        run: ./gradlew :seqeron-service:networkFaultTest --tests '*PartitionLeaderTest'

      - name: Asymmetric partition
        if: ${{ !cancelled() && steps.rules.outcome == 'success' }}
        run: ./gradlew :seqeron-service:networkFaultTest --tests '*AsymmetricPartitionTest'

      - name: Unrepaired follower
        if: ${{ !cancelled() && steps.rules.outcome == 'success' }}
        run: |
          ./gradlew :seqeron-service:networkFaultTest --tests '*UnrepairedFollowerTest'
          REPAIR=retransmit ./gradlew :seqeron-service:networkFaultTest --tests '*UnrepairedFollowerTest' --rerun

      - name: Jittery leader
        if: ${{ !cancelled() && steps.rules.outcome == 'success' }}
        run: ./gradlew :seqeron-service:networkFaultTest --tests '*JitteryLeaderTest'

      - name: Mute voter
        if: ${{ !cancelled() && steps.rules.outcome == 'success' }}
        run: ./gradlew :seqeron-service:networkFaultTest --tests '*MuteVoterTest'

      - name: Leader starved of CPU
        if: ${{ !cancelled() && steps.rules.outcome == 'success' }}
        run: ./gradlew :seqeron-service:networkFaultTest --tests '*ThrottledLeaderTest'

      - name: Gateway host relay link
        if: ${{ !cancelled() && steps.rules.outcome == 'success' }}
        run: |
          FAULT=loss ./gradlew :seqeron-service:networkFaultTest --tests '*RelayLinkTest'
          FAULT=jitter ./gradlew :seqeron-service:networkFaultTest --tests '*RelayLinkTest' --rerun

      - name: Slow archive control
        if: ${{ !cancelled() && steps.rules.outcome == 'success' }}
        run: |
          DIRECTION=request DELAY_MS=1500 ./gradlew :seqeron-service:networkFaultTest --tests '*SlowArchiveControlTest'
          DIRECTION=response DELAY_MS=1500 ./gradlew :seqeron-service:networkFaultTest --tests '*SlowArchiveControlTest' --rerun
          DIRECTION=request DELAY_MS=200 ./gradlew :seqeron-service:networkFaultTest --tests '*SlowArchiveControlTest' --rerun

      - name: Upload faulteron logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: network-fault-logs
          path: seqeron-service/build/system-test/
