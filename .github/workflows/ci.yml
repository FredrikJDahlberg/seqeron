name: linux

# The tree is developed on macOS/arm64 with Apple clang and libc++; this is the only
# place it is built against libstdc++ on x86-64.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang
            cc: clang
            cxx: clang++
          - name: gcc-14
            cc: gcc-14
            cxx: g++-14
    steps:
      - uses: actions/checkout@v4

      # Aeron 1.51.0's own CMakeLists requires CMake >= 3.30; noble ships 3.28.3.
      - name: Add Kitware's CMake repository
        run: |
          wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' \
            | sudo tee /etc/apt/sources.list.d/kitware.list > /dev/null

      # uuid-dev: Aeron's C driver, which only warns when libuuid is missing.
      - name: Install dependencies
        run: |
          grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake clang g++-14 uuid-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Aeron's CMake shells out to ./gradlew :aeron-all:assemble.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('CMakeLists.txt', 'versions.properties') }}
          restore-keys: gradle-

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Test
        run: cmake --build build --target run_tests

  # Prose is the one thing no compiler reads, and the module split proved it: every documented source
  # path moved and the docs kept the old ones, so the quickstart named a script that did not exist.
  docs:
    name: doc paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check every repo path named in docs and comments resolves
        run: python3 .github/check-doc-paths.py

  java:
    name: java
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-java-${{ hashFiles('**/*.gradle', 'versions.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-java-

      # JUnit 5 suite for the Java state machines; no Aeron runtime, no C++ build.
      # `test` is finalizedBy jacocoTestReport, so this also writes the coverage report.
      - name: Test
        run: ./gradlew test

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          print('| metric | covered | total | % |')
          print('|---|---|---|---|')
          # One report per module since the :seqeron-client/:seqeron-service split; summed, so the
          # table still measures the whole Java tree the way the single-source-set build's did.
          from pathlib import Path
          totals = {}
          for f in sorted(Path('.').glob('*/build/reports/jacoco/test/jacocoTestReport.xml')):
              for c in ET.parse(f).getroot().findall('counter'):
                  m, cv = totals.get(c.get('type'), (0, 0))
                  totals[c.get('type')] = (m + int(c.get('missed')), cv + int(c.get('covered')))
          for kind, (m, cv) in totals.items():
              t = m + cv
              print(f"| {kind.title()} | {cv} | {t} | {100*cv/t if t else 0:.1f}% |")
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '*/build/reports/jacoco/test/'

  # The consumable surface from source; the `installed` job below takes the find_package path. Both halves
  # of seqeron-examples resolve seqeron the way an outside consumer does — a published coordinate, and FetchContent over the checkout — so a
  # dependency re-scoped back to `implementation` or an include root that stops resolving
  # out-of-tree fails here rather than in someone else's build. Neither is run: following a tap
  # needs a live cluster, which is what the harnesses under seqeron-service/src/test/scripts are for.
  examples:
    name: examples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same two prerequisites as the build job: Aeron 1.51.0 needs CMake >= 3.30 (noble ships
      # 3.28.3) and warns its way past a missing libuuid.
      - name: Add Kitware's CMake repository
        run: |
          wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' \
            | sudo tee /etc/apt/sources.list.d/kitware.list > /dev/null

      - name: Install dependencies
        run: |
          grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake uuid-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-examples-${{ hashFiles('CMakeLists.txt', '**/*.gradle', 'versions.properties') }}
          restore-keys: gradle-examples-

      # The example resolves org.limitless:seqeron from ~/.m2, so it builds against this checkout's
      # artifacts rather than a released tag's, and only after this step.
      - name: Publish seqeron to the local repository
        run: ./gradlew publishToMavenLocal

      - name: Build the Java example
        run: ./gradlew -p seqeron-examples build

      # Not part of the repo's CMake project: its own configure, over SEQERON_SOURCE_DIR's default
      # of this checkout. SEQERON_BUILD_TESTS stays off here, so no GoogleTest and no core_tests.
      - name: Configure the C++ example
        run: cmake -S seqeron-examples -B seqeron-examples/cmake-build-release -DCMAKE_BUILD_TYPE=Release

      - name: Build the C++ example
        run: cmake --build seqeron-examples/cmake-build-release --target follow_stream -j $(nproc)

  # find_package(seqeron) against an installed tree, with an installed Aeron beside it.
  # The config file, the export set and the found-Aeron branch of
  # CMakeLists.txt are only exercised here.
  installed:
    name: installed package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PREFIX: ${{ github.workspace }}/prefix
    steps:
      - uses: actions/checkout@v4

      - name: Add Kitware's CMake repository
        run: |
          wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' \
            | sudo tee /etc/apt/sources.list.d/kitware.list > /dev/null

      - name: Install dependencies
        run: |
          grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake uuid-dev

      # Aeron's archive client generates its codecs through Aeron's own Gradle build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-installed-${{ hashFiles('versions.properties') }}
          restore-keys: gradle-installed-

      # The version seqeron pins, with the same codec-output patch its FetchContent applies. No driver:
      # seqeron_core needs only the clients.
      - name: Install Aeron
        run: |
          AERON_VERSION="$(sed -n 's/^aeron=//p' versions.properties)"
          git clone --depth 1 --branch "${AERON_VERSION}" https://github.com/real-logic/aeron.git "${RUNNER_TEMP}/aeron"
          (cd "${RUNNER_TEMP}/aeron" && cmake -P "${GITHUB_WORKSPACE}/cmake/FixAeronCodecOutputs.cmake")
          cmake -S "${RUNNER_TEMP}/aeron" -B "${RUNNER_TEMP}/aeron-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${PREFIX}" -DAERON_INSTALL_TARGETS=ON -DBUILD_AERON_DRIVER=OFF \
            -DAERON_TESTS=OFF -DAERON_BUILD_SAMPLES=OFF -DAERON_BUILD_DOCUMENTATION=OFF
          cmake --build "${RUNNER_TEMP}/aeron-build" -j "$(nproc)"
          cmake --install "${RUNNER_TEMP}/aeron-build"

      # Header-only, so installing needs a configure and no build. No _deps/aeron-src means the
      # installed Aeron was found rather than fetched.
      - name: Install seqeron
        run: |
          cmake -S . -B build-install -DCMAKE_PREFIX_PATH="${PREFIX}" -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
            -DSEQERON_BUILD_TESTS=OFF
          test ! -d build-install/_deps/aeron-src
          cmake --install build-install

      - name: Build the C++ example against the installed package
        run: |
          cmake -S seqeron-examples -B seqeron-examples/cmake-build-installed -DCMAKE_BUILD_TYPE=Release \
            -DSEQERON_FIND_PACKAGE=ON -DCMAKE_PREFIX_PATH="${PREFIX}"
          cmake --build seqeron-examples/cmake-build-installed --target follow_stream -j "$(nproc)"
