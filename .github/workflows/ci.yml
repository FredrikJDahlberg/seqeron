name: linux

# The tree is developed on macOS/arm64 with Apple clang and libc++; this is the only
# place it is built against libstdc++ on x86-64.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang
            cc: clang
            cxx: clang++
          - name: gcc-14
            cc: gcc-14
            cxx: g++-14
    steps:
      - uses: actions/checkout@v4

      # Aeron 1.51.0's own CMakeLists requires CMake >= 3.30; noble ships 3.28.3.
      - name: Add Kitware's CMake repository
        run: |
          wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' \
            | sudo tee /etc/apt/sources.list.d/kitware.list > /dev/null

      # uuid-dev: Aeron's C driver, which only warns when libuuid is missing.
      - name: Install dependencies
        run: |
          grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake clang g++-14 uuid-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Aeron's CMake shells out to ./gradlew :aeron-all:assemble.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: gradle-

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Test
        run: cmake --build build --target run_tests

  java:
    name: java
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-java-${{ hashFiles('*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-java-

      # JUnit 5 suite for the Java state machines; no Aeron runtime, no C++ build.
      # `test` is finalizedBy jacocoTestReport, so this also writes the coverage report.
      - name: Test
        run: ./gradlew test

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          print('| metric | covered | total | % |')
          print('|---|---|---|---|')
          r = ET.parse('build/reports/jacoco/test/jacocoTestReport.xml').getroot()
          for c in r.findall('counter'):
              m, cv = int(c.get('missed')), int(c.get('covered'))
              t = m + cv
              print(f"| {c.get('type').title()} | {cv} | {t} | {100*cv/t if t else 0:.1f}% |")
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/

  # The only thing that exercises the consumable surface. Both examples resolve seqeron the way an
  # outside consumer does — a published coordinate, and FetchContent over the checkout — so a
  # dependency re-scoped back to `implementation` or an include root that stops resolving
  # out-of-tree fails here rather than in someone else's build. Neither is run: following a tap
  # needs a live cluster, which is what the harnesses under src/test/scripts are for.
  examples:
    name: examples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same two prerequisites as the build job: Aeron 1.51.0 needs CMake >= 3.30 (noble ships
      # 3.28.3) and warns its way past a missing libuuid.
      - name: Add Kitware's CMake repository
        run: |
          wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' \
            | sudo tee /etc/apt/sources.list.d/kitware.list > /dev/null

      - name: Install dependencies
        run: |
          grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake uuid-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-examples-${{ hashFiles('CMakeLists.txt', '*.gradle') }}
          restore-keys: gradle-examples-

      # ~/.m2 is the whole distribution channel today (doc/publishing.md): no remote repository is
      # declared, so the example resolves org.limitless:seqeron only after this step.
      - name: Publish seqeron to the local repository
        run: ./gradlew publishToMavenLocal

      - name: Build the Java example
        run: ./gradlew -p examples/java build

      # Not part of the repo's CMake project: its own configure, over SEQERON_SOURCE_DIR's default
      # of this checkout. SEQERON_BUILD_TESTS stays off here, so no GoogleTest and no core_tests.
      - name: Configure the C++ example
        run: cmake -S examples/cpp -B examples/cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build the C++ example
        run: cmake --build examples/cpp/build --target follow_stream -j $(nproc)
