name: pages

# The client tier's API reference, Javadoc and Doxygen, at https://fredrikjdahlberg.github.io/seqeron/.
# Nothing is committed: each run renders one tag and replaces the whole site, so it shows that release only.
# Its own workflow rather than a release.yml job so a tag's pages can be republished by hand — run it from
# the Actions tab on main and name the tag. The tag supplies the sources and this file the steps, so a tag
# cut before this workflow existed can still be published. Only a tag is checked out, so the site is always
# a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.8.1'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# A newer tag's deploy waits for an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    name: API reference
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # Aeron 1.53.2's own CMakeLists requires CMake >= 3.30; noble ships 3.28.3.
      - name: Add Kitware's CMake repository
        run: |
          wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc \
            | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' \
            | sudo tee /etc/apt/sources.list.d/kitware.list > /dev/null

      - name: Install dependencies
        run: |
          grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake doxygen

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The client tier only, the surface doc/client-api.md defines; configuring fetches Aeron but builds none of it.
      - name: Render
        run: |
          ./gradlew :seqeron-client:javadoc
          cmake -B cmake-build-docs -DSEQERON_BUILD_TESTS=OFF
          cmake --build cmake-build-docs --target docs

      - name: Assemble the site
        run: |
          VERSION="$(cat VERSION)"
          mkdir site
          cp -R seqeron-client/build/docs/javadoc site/java
          cp -R cmake-build-docs/docs/html site/cpp
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="color-scheme" content="light dark">
          <title>seqeron ${VERSION} API</title>
          </head>
          <body style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem">
          <h1>seqeron ${VERSION}</h1>
          <p>The client tier's API reference.</p>
          <ul>
          <li><a href="java/">Java</a> — <code>org.limitless:seqeron</code></li>
          <li><a href="cpp/">C++</a> — <code>seqeron_core</code></li>
          </ul>
          <p><a href="https://github.com/${GITHUB_REPOSITORY}">Source, protocol spec and runbooks</a></p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deploy
