// :cluster — the sequencer, the replayer (both sides), the shared client classes, the tools, and the
// code generation for the schemas the cluster tier itself speaks. Nothing here may reference
// :gateways (doc/future-arch.md §11 step 1), and nothing here touches a PRODUCT payload — not its
// codecs and not its IR. sbe-session.xml and sbe-basicdata.xml are :gateways', sbe-order.xml the C++
// edge's, and each is generated and staged by the module that owns it.
//
// The one application-family schema generated here is core's own: sbe-probe.xml (payloadId 5), the
// protocol ClusterProbe speaks so this module's e2e scripts can drive a cluster with no product binary
// built (§11 step 5). It is private to tools/ClusterProbe — sequencer/ and replayer/ import it nowhere,
// and the sequencer still decodes no payloadId at all.

plugins {
    id 'application'
}

configurations {
    sbeCodegen
}

dependencies {
    implementation "io.aeron:aeron-cluster:${aeronVersion}"
    implementation "io.aeron:aeron-archive:${aeronVersion}"
    implementation "io.aeron:aeron-driver:${aeronVersion}"
    implementation "io.aeron:aeron-client:${aeronVersion}"
    implementation "org.agrona:agrona:${agronaVersion}"
    implementation "uk.co.real-logic:sbe-tool:${sbeVersion}"

    testImplementation "io.aeron:aeron-cluster:${aeronVersion}"
    testImplementation "io.aeron:aeron-archive:${aeronVersion}"
    testImplementation "io.aeron:aeron-driver:${aeronVersion}"
    testImplementation "io.aeron:aeron-client:${aeronVersion}"
    testImplementation "org.agrona:agrona:${agronaVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testRuntimeOnly    "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"

    sbeCodegen "uk.co.real-logic:sbe-all:${sbeVersion}"
}

// ── SBE code generation ────────────────────────────────────────────────────────
// src/main/sbe, not src/main/resources: these are codegen inputs and belong in no jar. The one file
// here a jar does need is topology.xsd, and it sits in resources for exactly that reason — ClusterCtl
// validates the topology document against it off its own classpath. The C++ build generates from three
// of these four by path — sbe-probe.xml is Java-only, because the probe is, which is also what keeps
// the C++ core's generated/sbe/core root free of any application codec.

// One root, but each schema owns a disjoint slice of it: its own package dir plus its own .sbeir.
// Each task declares and wipes exactly that slice. Declaring the shared root instead made the codec
// tasks overlap, and Gradle cannot clean an output it cannot attribute to one task — which is what let
// a message deleted from a schema leave its codec on disk to be compiled against.
def sbeGeneratedSrcDir = layout.buildDirectory.dir('generated/sources/sbe/main/java').get().asFile
def sbeSchemaDir       = file('src/main/sbe')

sourceSets.main.java.srcDir sbeGeneratedSrcDir

tasks.register('generateReplaySbe', JavaExec) {
    description = 'Generate Java SBE codecs from sbe-replay.xml (the node-local replay control protocol)'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    // Agrona's UnsafeBuffer needs this to access jdk.internal.misc.Unsafe on JDK 21+.
    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',               sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.target.language',          'Java'
    systemProperty 'sbe.java.generate.interfaces', 'false'
    systemProperty 'sbe.xinclude.aware',           'true'
    systemProperty 'sbe.generate.ir',              'true'

    args new File(sbeSchemaDir, 'sbe-replay.xml')

    inputs.file  new File(sbeSchemaDir, 'sbe-replay.xml')
    outputs.dir  new File(sbeGeneratedSrcDir, 'org/limitless/phixeron/sbe/replay')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-replay.sbeir')

    doFirst {
        new File(sbeGeneratedSrcDir, 'org/limitless/phixeron/sbe/replay').deleteDir()
        sbeGeneratedSrcDir.mkdirs()
    }
}

tasks.register('generateFrameSbe', JavaExec) {
    description = 'Generate Java SBE codecs from sbe-frame.xml (the Unsequenced/Sequenced envelope pair)'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',               sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.target.language',          'Java'
    systemProperty 'sbe.java.generate.interfaces', 'false'
    systemProperty 'sbe.xinclude.aware',           'true'
    systemProperty 'sbe.generate.ir',              'true'

    args new File(sbeSchemaDir, 'sbe-frame.xml')

    inputs.file  new File(sbeSchemaDir, 'sbe-frame.xml')
    outputs.dir  new File(sbeGeneratedSrcDir, 'org/limitless/phixeron/sbe/frame')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-frame.sbeir')

    doFirst {
        new File(sbeGeneratedSrcDir, 'org/limitless/phixeron/sbe/frame').deleteDir()
        sbeGeneratedSrcDir.mkdirs()
    }
}

tasks.register('generateProbeSbe', JavaExec) {
    description = 'Generate Java SBE codecs from sbe-probe.xml (the ClusterProbe load/liveness payload)'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',               sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.target.language',          'Java'
    systemProperty 'sbe.java.generate.interfaces', 'false'
    systemProperty 'sbe.xinclude.aware',           'true'
    systemProperty 'sbe.generate.ir',              'true'

    args new File(sbeSchemaDir, 'sbe-probe.xml')

    inputs.file  new File(sbeSchemaDir, 'sbe-probe.xml')
    outputs.dir  new File(sbeGeneratedSrcDir, 'org/limitless/phixeron/sbe/probe')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-probe.sbeir')

    doFirst {
        new File(sbeGeneratedSrcDir, 'org/limitless/phixeron/sbe/probe').deleteDir()
        sbeGeneratedSrcDir.mkdirs()
    }
}

// The two schemas the cluster tier speaks, plus its own probe payload. The PRODUCT payloads' codecs
// are :gateways', generated there — this module compiles against none of them, and shipping them in its
// jar was what let the "payload-agnostic" claim be true of the code and false of the artifact.
tasks.named('compileJava') {
    dependsOn 'generateReplaySbe', 'generateFrameSbe', 'generateProbeSbe'
}

// ── IR-only schemas ────────────────────────────────────────────────────────────

// IR only, no stubs: the Java side speaks the cluster protocol through io.aeron.cluster.codecs, so the
// mirror schema's codecs would be dead classes in the jar. The IR alone is what SbeLogPrinter needs to
// decode the Raft consensus-log recording (schema 111) that sits in every archive dir.
tasks.register('generateClusterSbeIr', JavaExec) {
    description = 'Generate the SBE IR (no codecs) from sbe-cluster.xml for SbeLogPrinter'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',      sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.xinclude.aware',  'true'
    systemProperty 'sbe.generate.stubs',  'false'
    systemProperty 'sbe.generate.ir',     'true'

    args new File(sbeSchemaDir, 'sbe-cluster.xml')

    inputs.file  new File(sbeSchemaDir, 'sbe-cluster.xml')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-cluster.sbeir')

    doFirst { sbeGeneratedSrcDir.mkdirs() }
}

// The SBE tasks above emit a .sbeir IR file alongside the generated Java (sbe.generate.ir). Copy those
// into a resource dir so they ship inside the jar and SbeLogPrinter can decode a recording without a
// path into build/. Copied rather than adding sbeGeneratedSrcDir to `resources` directly: that dir is
// full of generated .java, and the only filter available is set-wide, which would drop topology.xsd
// from the jar.
//
// Only the four schemas this module owns. SbeLogPrinter lists this directory on the classpath rather
// than naming schemas, so :gateways stages its own into the same path and a run over both jars sees all
// of them — while a run over this jar alone names no PRODUCT protocol, which is the point. sbe-probe is
// here so a probe-driven recording reads as ProbeMarker rather than as an undecodable payload.
def sbeIrResourceDir = layout.buildDirectory.dir('generated/resources/sbeir')

tasks.register('collectSbeIr', Copy) {
    description = 'Stage the generated SBE IR files as jar resources for SbeLogPrinter'
    dependsOn 'generateReplaySbe', 'generateFrameSbe', 'generateProbeSbe', 'generateClusterSbeIr'
    from(sbeGeneratedSrcDir) {
        include '*.sbeir'
        into 'org/limitless/phixeron/tools/sbeir'
    }
    into sbeIrResourceDir
}

// The Copy's destination is the resource ROOT, so the package path above is what lands in the jar.
sourceSets.main.resources.srcDir(tasks.named('collectSbeIr'))

// ── SBE log printer ────────────────────────────────────────────────────────────
// Offline dump of an Aeron Archive recording as JSON. The tool is the cluster tier's, and so is this
// task's classpath: this module's runtime, which carries the three schemas it owns and no application
// IR at all (doc/future-arch.md §11 step 7a.4). A core frame therefore prints in full and an
// application payload prints under its payloadId, labelled from the recording's own
// PayloadIdRegistered rows and not decoded. To name payloads inline instead, put a deployment's IR in
// front of the tool: sbe-log-printer.sh, which runs it over a jar holding every module's.
//
// No -o here on purpose. §13.1's pipe writes raw payload bytes to stdout, and Gradle re-encodes a
// child process's stdout as text — every non-ASCII byte comes out as U+FFFD. The pipe is the shell
// wrapper's, which execs the JVM directly.

tasks.register('sbeLogPrinter', JavaExec) {
    description = 'Print an SBE archive recording as JSON: -PlogDir=<archive dir> [-Pschema=<name>] ' +
                  '[-Pspec=<sbeir file>] [-Pstream=<id>] [-Poneline]'
    group       = 'application'

    classpath  = sourceSets.main.runtimeClasspath
    mainClass  = 'org.limitless.phixeron.tools.SbeLogPrinter'
    jvmArgs    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    // Relative paths on the command line are the caller's, and every caller runs from the repo root.
    workingDir rootProject.projectDir

    doFirst {
        final String logDir = project.findProperty('logDir')
        if (!logDir) {
            throw new GradleException('Usage: ./gradlew sbeLogPrinter -PlogDir=<archive dir> [-Pschema=<name>] ' +
                                      '[-Pspec=<sbeir file>] [-Pstream=<id>] [-Poneline]')
        }
        // No schema given: the printer decodes each frame against whichever bundled schema its header names.
        if (project.hasProperty('schema')) {
            args '--schema', project.property('schema')
        }
        if (project.hasProperty('spec')) {
            args '--spec', project.property('spec')
        }
        args logDir
        // Opt-in: dump only the newest recording on this stream (205 = the sequenced tap).
        if (project.hasProperty('stream')) {
            args '--stream', project.property('stream')
        }
        if (project.hasProperty('oneline')) {
            args '--oneline'
        }
    }
}

application {
    mainClass = 'org.limitless.phixeron.sequencer.SequencerServer'
}

tasks.named('run') {
    // Pass JVM flags required for Aeron's off-heap memory access
    jvmArgs '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    workingDir rootProject.projectDir
    standardInput = System.in
}
