// seqeron's Java half — the sequencer, the replayer (both sides), the tools, and the code generation
// for the schemas the cluster tier itself speaks. Nothing here touches an APPLICATION payload: not its
// codecs and not its IR. The product protocols (sbe-session.xml, sbe-basicdata.xml, sbe-order.xml) are
// their own repo's, generated and staged there, and this build compiles against none of them.
//
// The one application-family schema generated here is core's own: sbe-probe.xml (payloadId 5), the
// protocol ClusterProbe speaks so this repo's e2e scripts can drive a cluster with no product binary
// built. It is private to tools/ClusterProbe — sequencer/ and replayer/ import it nowhere, and the
// sequencer still decodes no payloadId at all.

plugins {
    id 'application'
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
}

group   = 'org.limitless'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Aeron and SBE are pinned to the same versions CMakeLists.txt fetches for the C++ half — the two
// sides generate independently from the same schemas and speak the same wire protocol, so a version
// that differs across them is a decode failure at runtime rather than a build error.
ext {
    aeronVersion  = '1.51.0'
    agronaVersion = '2.4.1'
    sbeVersion    = '1.38.1'
    junitVersion  = '5.10.2'
}

configurations {
    sbeCodegen
}

// api, not implementation, for the four that appear in this repo's own public signatures: anything
// consuming these classes compiles against DirectBuffer (SequencedFrameDecoder, SystemFrame), Aeron and
// Image (ReplayerStreamReceiver), AeronArchive (ReplayerService) and ClusteredService
// (SequencerService), so they belong on a consumer's compile classpath rather than being redeclared
// there. aeron-driver stays implementation — SequencerServer embeds a MediaDriver but exposes none. So
// does sbe-tool: SbeLogPrinter's List<Ir> constructor is the one leak, and the printer is a CLI, not a
// library entry point.
dependencies {
    api "io.aeron:aeron-cluster:${aeronVersion}"
    api "io.aeron:aeron-archive:${aeronVersion}"
    api "io.aeron:aeron-client:${aeronVersion}"
    api "org.agrona:agrona:${agronaVersion}"
    implementation "io.aeron:aeron-driver:${aeronVersion}"
    implementation "uk.co.real-logic:sbe-tool:${sbeVersion}"

    testImplementation "io.aeron:aeron-cluster:${aeronVersion}"
    testImplementation "io.aeron:aeron-archive:${aeronVersion}"
    testImplementation "io.aeron:aeron-driver:${aeronVersion}"
    testImplementation "io.aeron:aeron-client:${aeronVersion}"
    testImplementation "org.agrona:agrona:${agronaVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testRuntimeOnly    "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"

    sbeCodegen "uk.co.real-logic:sbe-all:${sbeVersion}"
}

// ── SBE code generation ────────────────────────────────────────────────────────
// src/main/sbe, not src/main/resources: these are codegen inputs and belong in no jar. The one file
// here a jar does need is topology.xsd, and it sits in resources for exactly that reason — ClusterCtl
// validates the topology document against it off its own classpath. The C++ build generates from three
// of these four by path — sbe-probe.xml is Java-only, because the probe is, which is also what keeps
// the C++ core's generated/sbe/core root free of any application codec.

// One root, but each schema owns a disjoint slice of it: its own package dir plus its own .sbeir.
// Each task declares and wipes exactly that slice. Declaring the shared root instead made the codec
// tasks overlap, and Gradle cannot clean an output it cannot attribute to one task — which is what let
// a message deleted from a schema leave its codec on disk to be compiled against.
def sbeGeneratedSrcDir = layout.buildDirectory.dir('generated/sources/sbe/main/java').get().asFile
def sbeSchemaDir       = file('src/main/sbe')

sourceSets.main.java.srcDir sbeGeneratedSrcDir

tasks.register('generateReplaySbe', JavaExec) {
    description = 'Generate Java SBE codecs from sbe-replay.xml (the node-local replay control protocol)'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    // Agrona's UnsafeBuffer needs this to access jdk.internal.misc.Unsafe on JDK 21+.
    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',               sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.target.language',          'Java'
    systemProperty 'sbe.java.generate.interfaces', 'false'
    systemProperty 'sbe.xinclude.aware',           'true'
    systemProperty 'sbe.generate.ir',              'true'

    args new File(sbeSchemaDir, 'sbe-replay.xml')

    inputs.file  new File(sbeSchemaDir, 'sbe-replay.xml')
    outputs.dir  new File(sbeGeneratedSrcDir, 'org/limitless/seqeron/sbe/replay')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-replay.sbeir')

    doFirst {
        new File(sbeGeneratedSrcDir, 'org/limitless/seqeron/sbe/replay').deleteDir()
        sbeGeneratedSrcDir.mkdirs()
    }
}

tasks.register('generateFrameSbe', JavaExec) {
    description = 'Generate Java SBE codecs from sbe-frame.xml (the Unsequenced/Sequenced envelope pair)'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',               sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.target.language',          'Java'
    systemProperty 'sbe.java.generate.interfaces', 'false'
    systemProperty 'sbe.xinclude.aware',           'true'
    systemProperty 'sbe.generate.ir',              'true'

    args new File(sbeSchemaDir, 'sbe-frame.xml')

    inputs.file  new File(sbeSchemaDir, 'sbe-frame.xml')
    outputs.dir  new File(sbeGeneratedSrcDir, 'org/limitless/seqeron/sbe/frame')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-frame.sbeir')

    doFirst {
        new File(sbeGeneratedSrcDir, 'org/limitless/seqeron/sbe/frame').deleteDir()
        sbeGeneratedSrcDir.mkdirs()
    }
}

tasks.register('generateProbeSbe', JavaExec) {
    description = 'Generate Java SBE codecs from sbe-probe.xml (the ClusterProbe load/liveness payload)'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',               sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.target.language',          'Java'
    systemProperty 'sbe.java.generate.interfaces', 'false'
    systemProperty 'sbe.xinclude.aware',           'true'
    systemProperty 'sbe.generate.ir',              'true'

    args new File(sbeSchemaDir, 'sbe-probe.xml')

    inputs.file  new File(sbeSchemaDir, 'sbe-probe.xml')
    outputs.dir  new File(sbeGeneratedSrcDir, 'org/limitless/seqeron/sbe/probe')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-probe.sbeir')

    doFirst {
        new File(sbeGeneratedSrcDir, 'org/limitless/seqeron/sbe/probe').deleteDir()
        sbeGeneratedSrcDir.mkdirs()
    }
}

// The two schemas the cluster tier speaks, plus its own probe payload. The PRODUCT payloads' codecs
// belong to the product repo, generated there — this build compiles against none of them, and shipping
// them here was what let the "payload-agnostic" claim be true of the code and false of the artifact.
tasks.named('compileJava') {
    dependsOn 'generateReplaySbe', 'generateFrameSbe', 'generateProbeSbe'
}

// ── IR-only schemas ────────────────────────────────────────────────────────────

// IR only, no stubs: the Java side speaks the cluster protocol through io.aeron.cluster.codecs, so the
// mirror schema's codecs would be dead classes in the jar. The IR alone is what SbeLogPrinter needs to
// decode the Raft consensus-log recording (schema 111) that sits in every archive dir.
tasks.register('generateClusterSbeIr', JavaExec) {
    description = 'Generate the SBE IR (no codecs) from sbe-cluster.xml for SbeLogPrinter'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',      sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.xinclude.aware',  'true'
    systemProperty 'sbe.generate.stubs',  'false'
    systemProperty 'sbe.generate.ir',     'true'

    args new File(sbeSchemaDir, 'sbe-cluster.xml')

    inputs.file  new File(sbeSchemaDir, 'sbe-cluster.xml')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-cluster.sbeir')

    doFirst { sbeGeneratedSrcDir.mkdirs() }
}

// The SBE tasks above emit a .sbeir IR file alongside the generated Java (sbe.generate.ir). Copy those
// into a resource dir so they ship inside the jar and SbeLogPrinter can decode a recording without a
// path into build/. Copied rather than adding sbeGeneratedSrcDir to `resources` directly: that dir is
// full of generated .java, and the only filter available is set-wide, which would drop topology.xsd
// from the jar.
//
// Only the four schemas this repo owns. SbeLogPrinter lists this directory on the classpath rather
// than naming schemas, so a product jar stages its own into the same path and a run over both sees all
// of them — while a run over this jar alone names no PRODUCT protocol, which is the point. sbe-probe is
// here so a probe-driven recording reads as ProbeMarker rather than as an undecodable payload.
def sbeIrResourceDir = layout.buildDirectory.dir('generated/resources/sbeir')

tasks.register('collectSbeIr', Copy) {
    description = 'Stage the generated SBE IR files as jar resources for SbeLogPrinter'
    dependsOn 'generateReplaySbe', 'generateFrameSbe', 'generateProbeSbe', 'generateClusterSbeIr'
    // Wiped first, like every codegen step here: a Copy leaves whatever an earlier run put in the
    // destination, so a moved staging path would otherwise ship in the jar twice.
    doFirst { delete sbeIrResourceDir }
    from(sbeGeneratedSrcDir) {
        include '*.sbeir'
        into 'META-INF/seqeron/sbeir'
    }
    into sbeIrResourceDir
}

// The Copy's destination is the resource ROOT, so the path above is what lands in the jar. It is
// META-INF rather than a package dir: a consumer stages its own protocol's IR into the same
// directory, and that must not mean writing into seqeron's package namespace (registries.md's rule).
sourceSets.main.resources.srcDir(tasks.named('collectSbeIr'))

// ── SBE log printer ────────────────────────────────────────────────────────────
// Offline dump of an Aeron Archive recording as JSON. The tool is the cluster tier's, and so is this
// task's classpath: this repo's runtime, which carries the four schemas it owns and no application
// IR at all. A core frame therefore prints in full and an application payload prints under its
// payloadId, labelled from the recording's own PayloadIdRegistered rows and not decoded. To name
// payloads inline instead, put a deployment's IR in front of the tool: sbe-log-printer.sh, and point
// SEQERON_JAR at a jar that holds it.
//
// No -o here on purpose. §13.1's pipe writes raw payload bytes to stdout, and Gradle re-encodes a
// child process's stdout as text — every non-ASCII byte comes out as U+FFFD. The pipe is the shell
// wrapper's, which execs the JVM directly.

tasks.register('sbeLogPrinter', JavaExec) {
    description = 'Print an SBE archive recording as JSON: -PlogDir=<archive dir> [-Pschema=<name>] ' +
                  '[-Pspec=<sbeir file>] [-Pstream=<id>] [-Poneline]'
    group       = 'application'

    classpath  = sourceSets.main.runtimeClasspath
    mainClass  = 'org.limitless.seqeron.tools.SbeLogPrinter'
    jvmArgs    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    // Relative paths on the command line are the caller's, and every caller runs from the repo root.
    workingDir rootProject.projectDir

    doFirst {
        final String logDir = project.findProperty('logDir')
        if (!logDir) {
            throw new GradleException('Usage: ./gradlew sbeLogPrinter -PlogDir=<archive dir> [-Pschema=<name>] ' +
                                      '[-Pspec=<sbeir file>] [-Pstream=<id>] [-Poneline]')
        }
        // No schema given: the printer decodes each frame against whichever bundled schema its header names.
        if (project.hasProperty('schema')) {
            args '--schema', project.property('schema')
        }
        if (project.hasProperty('spec')) {
            args '--spec', project.property('spec')
        }
        args logDir
        // Opt-in: dump only the newest recording on this stream (205 = the sequenced tap).
        if (project.hasProperty('stream')) {
            args '--stream', project.property('stream')
        }
        if (project.hasProperty('oneline')) {
            args '--oneline'
        }
    }
}

application {
    mainClass = 'org.limitless.seqeron.sequencer.SequencerServer'
}

tasks.named('run') {
    // Pass JVM flags required for Aeron's off-heap memory access
    jvmArgs '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    workingDir rootProject.projectDir
    standardInput = System.in
}

// ── Tests ──────────────────────────────────────────────────────────────────────
// The suite covers the deterministic decision-making — Sequencer, and ReplayerService through its
// Replayer seam — and deliberately touches no Aeron runtime: no media driver, no cluster, no Aeron
// mocks, so it runs in about a second. Everything Aeron-shaped is covered by core_tests (C++) and the
// end-to-end scripts under src/test/scripts.

tasks.named('test') {
    useJUnitPlatform()
    // Agrona's UnsafeBuffer needs this to access jdk.internal.misc.Unsafe on JDK 21+.
    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required  = true
        html.required = true
    }
    // Generated SBE codecs are the tool's output, not this repo's code; counting them buries the
    // hand-written classes the report exists to measure.
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, exclude: 'org/limitless/seqeron/sbe/**')
        })
    )
}

// ── Uber jar ───────────────────────────────────────────────────────────────────
// Every script resolves build/libs/seqeron-<version>-uber.jar: clusterctl.sh, sbe-log-printer.sh, the
// metrics scripts, and each harness under src/test/scripts. They run it two ways — `java -jar` for the
// sequencer (Main-Class below) and `java -cp` for ReplayerServer, ClusterProbe, ClusterCtl and the rest
// — so the jar carries every runtime dependency plus the staged .sbeir resources SbeLogPrinter reads
// off its own classpath.

tasks.register('uberJar', Jar) {
    description = 'Fat jar carrying every runtime dependency: build/libs/seqeron-<version>-uber.jar'
    group       = 'build'

    archiveClassifier = 'uber'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }

    // The jar redistributes Aeron, Agrona and sbe-tool, so it must carry a copy of the license they
    // and this repo share (Apache 2.0 §4a) and this repo's NOTICE (§4d). First, so
    // DuplicatesStrategy.EXCLUDE keeps these.
    from('LICENSE') { into 'META-INF' }
    from('NOTICE') { into 'META-INF' }

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Dependency jars collide on module-info and on their signatures; a signed entry in a repacked jar
    // fails verification at load rather than at build time.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**/module-info.class',
            'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ── Split by audience ──────────────────────────────────────────────────────────
// Two published artifacts out of one source tree (doc/future-arch.md §6): `seqeron` is the CLIENT tier —
// what a process that merely talks to a cluster needs: the envelope, the ingress client, the replay
// client, the port block, the logger and the counters — and `seqeron-node` is the cluster itself: the
// sequencer, the Replayer, the tools and the metrics exporter. A producer should not put the archive and
// the media driver on its classpath to encode a frame. (aeron-cluster stays a client dependency: the
// cluster client and the consensus module ship in one upstream artifact, so it is not ours to split.)
//
// The tiers are packages, not source sets, because the line runs through `sequencer` — FrameLayer,
// SystemFrame, PortLayout and the Ingress* classes are the client's, Sequencer and SequencerServer the
// node's — and splitting a package across two source roots costs more than the check below.
ext.clientTierPatterns = [
    'org/limitless/seqeron/sbe/frame/**',
    'org/limitless/seqeron/sbe/replay/**',
    'org/limitless/seqeron/replayer/client/**',
    'org/limitless/seqeron/util/**',
    'org/limitless/seqeron/metrics/SeqeronCounters*',
    'org/limitless/seqeron/sequencer/FrameLayer*',
    'org/limitless/seqeron/sequencer/SystemFrame*',
    'org/limitless/seqeron/sequencer/PortLayout*',
    'org/limitless/seqeron/sequencer/Ingress*',
    'org/limitless/seqeron/sequencer/ClusterStreamSender*',
]

tasks.register('clientJar', Jar) {
    description = 'The client tier alone — what a producer or consumer needs to talk to a cluster'
    group       = 'build'
    archiveAppendix = 'client'
    from sourceSets.main.output
    include clientTierPatterns
}

tasks.register('nodeJar', Jar) {
    description = 'The node tier: the sequencer, the Replayer, the tools and the metrics exporter'
    group       = 'build'
    archiveAppendix = 'node'
    from sourceSets.main.output
    exclude clientTierPatterns
}

// The client tier must stay a tier: a client class that reaches for the node compiles here (one source
// set) and then fails at runtime in a consumer that took `seqeron` alone, which is the worst place to
// find out. Checked on the compiled classes rather than on imports, so a same-package reference —
// sequencer/ holds both tiers — cannot slip through unimported.
tasks.register('checkTierSeparation') {
    description = 'Fails if the client tier references the node tier, or Aeron beyond the client'
    group       = 'verification'
    dependsOn tasks.named('classes')

    final FileCollection clientClasses =
        fileTree(sourceSets.main.output.classesDirs.singleFile).matching { include clientTierPatterns }
    inputs.files clientClasses

    doLast {
        final List<String> forbidden = [
            'org/limitless/seqeron/sequencer/Sequencer',
            'org/limitless/seqeron/sequencer/TapPublisher',
            'org/limitless/seqeron/sequencer/TapStallPolicy',
            'org/limitless/seqeron/replayer/server/',
            'org/limitless/seqeron/tools/',
            'org/limitless/seqeron/metrics/Metrics',
            'io/aeron/archive/',
            'io/aeron/driver/',
        ]
        final List<String> leaks = []
        clientClasses.each { File f ->
            final String pool = new String(f.bytes, 'ISO-8859-1')
            forbidden.each { String ref ->
                if (pool.contains(ref)) {
                    leaks << "${f.name} -> ${ref}"
                }
            }
        }
        if (!leaks.isEmpty()) {
            throw new GradleException(
                "client tier references the node tier:\n  " + leaks.join('\n  ') +
                "\nEither the class belongs in the node tier, or the constant it reached for belongs in " +
                "the client tier (FrameLayer, PortLayout, ReplayerStreamReceiver).")
        }
    }
}

tasks.named('check') { dependsOn 'checkTierSeparation' }

// ── Publishing ─────────────────────────────────────────────────────────────────
// Two artifacts, by audience (see "Split by audience" below): `seqeron` is the client tier and
// `seqeron-node` the cluster, the latter depending on the former. A consumer that only talks to a
// cluster declares `seqeron` and gets aeron-client, aeron-cluster and Agrona with it — not the archive,
// not the media driver, and none of the sequencer. `./gradlew publishToMavenLocal` is the whole workflow
// for now; no remote repository is declared.
//
// The uber jar is deliberately NOT published. It is the runnable artifact every script resolves out of
// build/libs, and it repacks Aeron and Agrona — publishing it would put a shaded copy of them on a
// consumer's classpath beside the real ones.

publishing {
    publications {
        client(MavenPublication) {
            artifactId = 'seqeron'
            artifact tasks.named('clientJar')
            pom.withXml {
                final Node deps = asNode().appendNode('dependencies')
                [['io.aeron', 'aeron-client', aeronVersion],
                 ['io.aeron', 'aeron-cluster', aeronVersion],
                 ['org.agrona', 'agrona', agronaVersion]].each { g, a, v ->
                    final Node d = deps.appendNode('dependency')
                    d.appendNode('groupId', g)
                    d.appendNode('artifactId', a)
                    d.appendNode('version', v)
                    d.appendNode('scope', 'compile')
                }
            }
        }
        node(MavenPublication) {
            artifactId = 'seqeron-node'
            artifact tasks.named('nodeJar')
            pom.withXml {
                final Node deps = asNode().appendNode('dependencies')
                [[project.group, 'seqeron', project.version],
                 ['io.aeron', 'aeron-archive', aeronVersion],
                 ['io.aeron', 'aeron-driver', aeronVersion],
                 ['uk.co.real-logic', 'sbe-tool', sbeVersion]].each { g, a, v ->
                    final Node d = deps.appendNode('dependency')
                    d.appendNode('groupId', g)
                    d.appendNode('artifactId', a)
                    d.appendNode('version', v)
                    d.appendNode('scope', 'compile')
                }
            }
        }
    }
}
