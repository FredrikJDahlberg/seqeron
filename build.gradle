// :cluster — the sequencer, the replayer (both sides), the shared client classes, the tools, and the
// code generation for the schemas the cluster tier itself speaks. Nothing here may reference
// :gateways (doc/future-arch.md §11 step 1), and nothing here touches an application payload at all —
// not its codecs and not its IR. sbe-session.xml and sbe-basicdata.xml are :gateways', sbe-order.xml
// the C++ edge's, and each is generated and staged by the module that owns it.

plugins {
    id 'application'
}

configurations {
    sbeCodegen
}

dependencies {
    implementation "io.aeron:aeron-cluster:${aeronVersion}"
    implementation "io.aeron:aeron-archive:${aeronVersion}"
    implementation "io.aeron:aeron-driver:${aeronVersion}"
    implementation "io.aeron:aeron-client:${aeronVersion}"
    implementation "org.agrona:agrona:${agronaVersion}"
    implementation "uk.co.real-logic:sbe-tool:${sbeVersion}"

    testImplementation "io.aeron:aeron-cluster:${aeronVersion}"
    testImplementation "io.aeron:aeron-archive:${aeronVersion}"
    testImplementation "io.aeron:aeron-driver:${aeronVersion}"
    testImplementation "io.aeron:aeron-client:${aeronVersion}"
    testImplementation "org.agrona:agrona:${agronaVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testRuntimeOnly    "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"

    sbeCodegen "uk.co.real-logic:sbe-all:${sbeVersion}"
}

// ── SBE code generation ────────────────────────────────────────────────────────
// The schemas stay at the repo root for now: the C++ build generates from the same files, and
// splitting them per module is doc/future-arch.md §11 step 7a.1. They are codegen inputs, named per
// task below, and belong in no jar — topology.xsd moved ahead of them precisely because it is the one
// file here a jar needs: ClusterCtl validates the topology document against it off its own classpath.

// One root, but each schema owns a disjoint slice of it: its own package dir plus its own .sbeir.
// Each task declares and wipes exactly that slice. Declaring the shared root instead made the codec
// tasks overlap, and Gradle cannot clean an output it cannot attribute to one task — which is what let
// a message deleted from a schema leave its codec on disk to be compiled against.
def sbeGeneratedSrcDir = layout.buildDirectory.dir('generated/sources/sbe/main/java').get().asFile
def sbeResourceDir     = rootProject.file('src/main/resources')

sourceSets.main.java.srcDir sbeGeneratedSrcDir

tasks.register('generateReplaySbe', JavaExec) {
    description = 'Generate Java SBE codecs from sbe-replay.xml (the node-local replay control protocol)'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    // Agrona's UnsafeBuffer needs this to access jdk.internal.misc.Unsafe on JDK 21+.
    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',               sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.target.language',          'Java'
    systemProperty 'sbe.java.generate.interfaces', 'false'
    systemProperty 'sbe.xinclude.aware',           'true'
    systemProperty 'sbe.generate.ir',              'true'

    args new File(sbeResourceDir, 'sbe-replay.xml')

    inputs.file  new File(sbeResourceDir, 'sbe-replay.xml')
    outputs.dir  new File(sbeGeneratedSrcDir, 'org/limitless/phixeron/sbe/replay')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-replay.sbeir')

    doFirst {
        new File(sbeGeneratedSrcDir, 'org/limitless/phixeron/sbe/replay').deleteDir()
        sbeGeneratedSrcDir.mkdirs()
    }
}

tasks.register('generateFrameSbe', JavaExec) {
    description = 'Generate Java SBE codecs from sbe-frame.xml (the Unsequenced/Sequenced envelope pair)'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',               sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.target.language',          'Java'
    systemProperty 'sbe.java.generate.interfaces', 'false'
    systemProperty 'sbe.xinclude.aware',           'true'
    systemProperty 'sbe.generate.ir',              'true'

    args new File(sbeResourceDir, 'sbe-frame.xml')

    inputs.file  new File(sbeResourceDir, 'sbe-frame.xml')
    outputs.dir  new File(sbeGeneratedSrcDir, 'org/limitless/phixeron/sbe/frame')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-frame.sbeir')

    doFirst {
        new File(sbeGeneratedSrcDir, 'org/limitless/phixeron/sbe/frame').deleteDir()
        sbeGeneratedSrcDir.mkdirs()
    }
}

// Only the two schemas the cluster tier speaks. The application payloads' codecs are :gateways',
// generated there — this module compiles against none of them, and shipping them in its jar was what
// let the "payload-agnostic" claim be true of the code and false of the artifact.
tasks.named('compileJava') {
    dependsOn 'generateReplaySbe', 'generateFrameSbe'
}

// ── IR-only schemas ────────────────────────────────────────────────────────────

// IR only, no stubs: the Java side speaks the cluster protocol through io.aeron.cluster.codecs, so the
// mirror schema's codecs would be dead classes in the jar. The IR alone is what SbeLogPrinter needs to
// decode the Raft consensus-log recording (schema 111) that sits in every archive dir.
tasks.register('generateClusterSbeIr', JavaExec) {
    description = 'Generate the SBE IR (no codecs) from sbe-cluster.xml for SbeLogPrinter'
    classpath   = configurations.sbeCodegen
    mainClass   = 'uk.co.real_logic.sbe.SbeTool'

    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'

    systemProperty 'sbe.output.dir',      sbeGeneratedSrcDir.absolutePath
    systemProperty 'sbe.xinclude.aware',  'true'
    systemProperty 'sbe.generate.stubs',  'false'
    systemProperty 'sbe.generate.ir',     'true'

    args new File(sbeResourceDir, 'sbe-cluster.xml')

    inputs.file  new File(sbeResourceDir, 'sbe-cluster.xml')
    outputs.file new File(sbeGeneratedSrcDir, 'sbe-cluster.sbeir')

    doFirst { sbeGeneratedSrcDir.mkdirs() }
}

// The SBE tasks above emit a .sbeir IR file alongside the generated Java (sbe.generate.ir). Copy those
// into a resource dir so they ship inside the jar and SbeLogPrinter can decode a recording without a
// path into build/. Copied rather than adding sbeGeneratedSrcDir to `resources` directly: that dir is
// full of generated .java, and the only filter available is set-wide, which would drop the XMLs in
// src/main/resources from the jar.
//
// Only the three schemas this module owns. SbeLogPrinter lists this directory on the classpath rather
// than naming schemas, so :gateways stages its own into the same path and a run over both jars sees all
// of them — while a run over this jar alone names no application protocol, which is the point.
def sbeIrResourceDir = layout.buildDirectory.dir('generated/resources/sbeir')

tasks.register('collectSbeIr', Copy) {
    description = 'Stage the generated SBE IR files as jar resources for SbeLogPrinter'
    dependsOn 'generateReplaySbe', 'generateFrameSbe', 'generateClusterSbeIr'
    from(sbeGeneratedSrcDir) {
        include '*.sbeir'
        into 'org/limitless/phixeron/tools/sbeir'
    }
    into sbeIrResourceDir
}

// The Copy's destination is the resource ROOT, so the package path above is what lands in the jar.
sourceSets.main.resources.srcDir(tasks.named('collectSbeIr'))

application {
    mainClass = 'org.limitless.phixeron.sequencer.SequencerServer'
}

tasks.named('run') {
    // Pass JVM flags required for Aeron's off-heap memory access
    jvmArgs '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
    workingDir rootProject.projectDir
    standardInput = System.in
}
