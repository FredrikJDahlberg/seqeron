// seqeron's Java half, in two modules by audience (settings.gradle). This file holds only what both
// share plus the BOM, which names neither module's classes.

plugins {
    id 'maven-publish'
}

group   = 'org.limitless'
// VERSION is the one place the number is written; CMakeLists.txt reads the same file.
version = file('VERSION').text.trim()

// On JitPack, publish under the coordinates it serves — com.github.<user>.<repo>:<artifactId>:<tag> —
// so seqeron-service's POM dependency on seqeron names an artifact that exists there.
if (System.getenv('JITPACK')) {
    group   = "${System.getenv('GROUP')}.${System.getenv('ARTIFACT')}"
    version = System.getenv('VERSION')
}

// Aeron, Agrona and SBE come from versions.properties, which CMakeLists.txt reads too.
def pins = new Properties()
file('versions.properties').withInputStream { pins.load(it) }

ext {
    aeronVersion  = pins.getProperty('aeron')
    agronaVersion = pins.getProperty('agrona')
    sbeVersion    = pins.getProperty('sbe')
    junitVersion  = '5.10.2'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'maven-publish'

    group   = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    configurations {
        sbeCodegen
    }

    dependencies {
        sbeCodegen "uk.co.real-logic:sbe-all:${rootProject.ext.sbeVersion}"

        testImplementation "org.junit.jupiter:junit-jupiter-api:${rootProject.ext.junitVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter-params:${rootProject.ext.junitVersion}"
        testRuntimeOnly    "org.junit.jupiter:junit-jupiter-engine:${rootProject.ext.junitVersion}"
    }

    tasks.named('test') {
        useJUnitPlatform()
        // Agrona's UnsafeBuffer needs this to access jdk.internal.misc.Unsafe on JDK 21+.
        jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
        finalizedBy 'jacocoTestReport'
    }

    tasks.named('jacocoTestReport') {
        dependsOn 'test'
        reports {
            xml.required  = true
            html.required = true
        }
        // Generated SBE codecs are the tool's output, not this repo's code; counting them buries the
        // hand-written classes the report exists to measure.
        classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: 'org/limitless/seqeron/sbe/**')
            })
        )
    }
}

// ── Publishing ─────────────────────────────────────────────────────────────────
// Each module publishes itself (client/build.gradle, node/build.gradle). The BOM lives here because it
// names both and belongs to neither: Aeron, Agrona and SBE at the versions seqeron was built against.
// Gradle otherwise resolves a consumer's own Aeron pin against ours by taking the higher, and a version
// that differs from the cluster's fails as frames that do not decode, not at build time.
def appendDependencies = { Node parent, List rows ->
    final Node deps = parent.appendNode('dependencies')
    rows.each { g, a, v, s ->
        final Node d = deps.appendNode('dependency')
        d.appendNode('groupId', g)
        d.appendNode('artifactId', a)
        d.appendNode('version', v)
        if (s) {
            d.appendNode('scope', s)
        }
    }
}

publishing {
    publications {
        bom(MavenPublication) {
            artifactId = 'seqeron-bom'
            pom.packaging = 'pom'
            pom.withXml {
                appendDependencies(asNode().appendNode('dependencyManagement'), [
                    [project.group, 'seqeron', project.version, null],
                    [project.group, 'seqeron-service', project.version, null],
                    ['io.aeron', 'aeron-client', aeronVersion, null],
                    ['io.aeron', 'aeron-cluster', aeronVersion, null],
                    ['io.aeron', 'aeron-archive', aeronVersion, null],
                    ['io.aeron', 'aeron-driver', aeronVersion, null],
                    ['org.agrona', 'agrona', agronaVersion, null],
                    ['uk.co.real-logic', 'sbe-tool', sbeVersion, null]])
            }
        }
    }
}
