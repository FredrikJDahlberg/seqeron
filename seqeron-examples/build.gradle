// A consumer of seqeron, built outside its build: no source dependency, no subproject, just the
// published coordinate. That is the point — anything the artifact fails to expose fails here rather
// than passing on a source dependency.

plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// src/java beside src/cpp, one tree for both examples, rather than Gradle's src/main/java.
sourceSets.main.java.srcDirs = ['src/java']

repositories {
    // ./gradlew publishToMavenLocal in the repo root puts seqeron here; Aeron and Agrona come from
    // Central, as the transitive dependencies its POM declares.
    mavenLocal()
    mavenCentral()
}

// One dependency, versioned by the BOM. seqeron declares Aeron and Agrona api, since they are in the
// signatures a consumer compiles against, so they arrive with it and are not redeclared here; the
// enforced platform holds them at seqeron's versions even if something else on the classpath asks for another.
// The version is read from the checkout this example ships in, so a bump does not break it. An outside
// consumer writes the number instead.
dependencies {
    implementation enforcedPlatform("org.limitless:seqeron-bom:${file('../VERSION').text.trim()}")
    implementation 'org.limitless:seqeron'
}

application {
    mainClass = 'example.FollowStream'
    // Aeron's off-heap access, the same flags every script in the seqeron repo passes.
    applicationDefaultJvmArgs = ['--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                                 '--add-opens=java.base/java.lang=ALL-UNNAMED',
                                 '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                                 '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED']
}

tasks.named('run') {
    systemProperties System.getProperties().findAll { k, v -> k.toString().startsWith('follow.') }
}

// The same flow against the front door: app, protocol.Publish and nothing else. A second JavaExec rather
// than a second `application` block, since Gradle's plugin models one main class.
// What ColocatedApp is for: the front door is sufficient on its own. Compiling it proves nothing on its
// own — an import of sequencer.client would compile too — so the imports are the assertion. seqeron's own
// FacadeSurfaceTest checks the same claim from the inside; this checks it from a consumer's build.
def facadeOnlyPackages = ['org.limitless.seqeron.app.', 'org.limitless.seqeron.protocol.Publish']

tasks.register('checkFacadeOnly') {
    description = 'Fail if the façade example reaches past app for anything but protocol.Publish'
    group       = 'verification'
    def source  = file('src/java/example/ColocatedApp.java')
    inputs.file source
    doLast {
        def leaks = source.readLines()
            .findAll { it.startsWith('import org.limitless.seqeron.') }
            .collect { it.replaceAll(/^import |;$/, '') }
            .findAll { imported -> !facadeOnlyPackages.any { imported.startsWith(it) } }
        if (!leaks.isEmpty()) {
            throw new GradleException("ColocatedApp must name only ${facadeOnlyPackages}, but imports ${leaks}")
        }
    }
}

tasks.named('check') { dependsOn 'checkFacadeOnly' }

tasks.register('runColocated', JavaExec) {
    description = 'Run the façade example (app.ColocatedApplication) against a running node'
    group       = 'application'
    classpath   = sourceSets.main.runtimeClasspath
    mainClass   = 'example.ColocatedApp'
    jvmArgs     = application.applicationDefaultJvmArgs
    systemProperties System.getProperties().findAll { k, v -> k.toString().startsWith('colocated.') }
}
