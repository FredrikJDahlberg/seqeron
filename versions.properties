# Dependency versions the builds share: build.gradle loads this file, CMakeLists.txt parses it, and
# Directory.Build.props reads it for the C# build.
# The Java and C++ halves generate from the same schemas and speak the same wire protocol, so a version
# that differs across them is a runtime decode failure rather than a build error. Agrona moves with Aeron.
aeron=1.53.2
agrona=2.6.1
sbe=1.40.2
# Aeron.NET trails Aeron. 1.52.2 matches 1.53.2 on every interface a client uses (driver CnC, command
# protocol, log metadata, cluster client protocol and codecs) and is re-verified on each Aeron upgrade.
aeronDotnet=1.52.2
# The SBE C# runtime on NuGet stops at 1.23.1.1; the codecs `sbe` generates compile against it.
sbeDotnetRuntime=1.23.1.1
