# Dependency versions both builds share: build.gradle loads this file and CMakeLists.txt parses it.
# The Java and C++ halves generate from the same schemas and speak the same wire protocol, so a version
# that differs across them is a runtime decode failure rather than a build error. Agrona moves with Aeron.
aeron=1.53.2
agrona=2.6.1
sbe=1.40.2
